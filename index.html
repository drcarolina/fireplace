<script id="flameShader" type="x-shader/x-fragment">#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2 uResolution;
uniform float uTime,uFire,uLogs,uDraft,uSparks,uRoom,uLight,uMaterial,uWood;
uniform vec4 uPops[6];
uniform vec4 uWoodMix;
float hash(float n){return fract(sin(n*127.1)*43758.5453);}
float hash2(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
vec2 hash22(vec2 p){vec3 q=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973));q+=dot(q,q.yzx+33.33);return fract((q.xx+q.yz)*q.zy);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash2(i),hash2(i+vec2(1,0)),f.x),mix(hash2(i+vec2(0,1)),hash2(i+1.),f.x),f.y);}
float fbm(vec2 p){float n=.52*noise(p);p=mat2(1.63,1.21,-1.21,1.63)*p;n+=.26*noise(p);p=mat2(1.71,1.18,-1.18,1.71)*p;n+=.13*noise(p);p=p*2.07+11.7;n+=.065*noise(p);return n;}
float box(vec2 p,vec2 b){vec2 d=abs(p)-b;return length(max(d,0.))+min(max(d.x,d.y),0.);}
float line(vec2 p,vec2 a,vec2 b){vec2 d=b-a;return length(p-a-d*clamp(dot(p-a,d)/dot(d,d),0.,1.));}
vec3 temperature(float t){t=clamp(t,0.,1.);vec3 c=mix(vec3(.6,.025,.002),vec3(2.7,.33,.008),smoothstep(0.,.35,t));c=mix(c,vec3(4.7,1.65,.11),smoothstep(.25,.68,t));return mix(c,vec3(6.,4.6,1.9),smoothstep(.65,1.,t));}
vec3 stone(vec2 p,float mat,float irradiance){
 float grit=noise(p*135.)*.4+noise(p*43.)*.6;vec3 albedo;float joint=1.,relief=1.,shine=0.;
 if(mat<.5){vec2 q=p*vec2(3.8,8.0);float row=floor(q.y);q.x+=mod(row,2.)*.5;vec2 id=floor(q),f=fract(q);vec2 edge=min(f,1.-f);joint=smoothstep(.013,.055,min(edge.x*.72,edge.y));float rnd=hash2(id);albedo=mix(vec3(.075,.058,.043),mix(vec3(.23,.069,.029),vec3(.42,.18,.081),rnd)*( .65+.5*grit),joint);relief=.76+.24*smoothstep(.02,.11,f.y);}
 else if(mat<1.5){vec2 q=p*vec2(4.3,5.4),cell=floor(q);float d1=10.,d2=10.;vec2 chosen=vec2(0);for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){vec2 id=cell+vec2(i,j);vec2 o=vec2(i,j)+.18+.64*hash22(id)-fract(q);float d=dot(o,o);if(d<d1){d2=d1;d1=d;chosen=id;}else d2=min(d2,d);}joint=smoothstep(.012,.12,d2-d1);float rnd=hash2(chosen);albedo=mix(vec3(.04,.038,.033),mix(vec3(.18,.165,.13),vec3(.37,.325,.25),rnd)*(.65+.5*grit),joint);relief=.7+.3*noise(p*11.);}
 else if(mat<2.5){vec2 q=p*vec2(2.1,9.5);q.x+=floor(q.y)*.371;vec2 f=fract(q);joint=smoothstep(.01,.045,min(min(f.x,1.-f.x),min(f.y,1.-f.y)));float stria=noise(vec2(p.x*17.,p.y*180.));albedo=mix(vec3(.023),vec3(.11,.125,.132)*(.6+grit*.7+stria*.4),joint);shine=.11;}
 else if(mat<3.5){float vein=abs(sin(p.x*3.4+p.y*2.7+fbm(p*2.8)*7.+fbm(p*9.)*.7));float v=1.-smoothstep(.0,.11,vein);float faint=1.-smoothstep(.0,.24,vein);albedo=mix(vec3(.7,.68,.61),vec3(.23,.25,.24),v*.6+faint*.18)*( .92+.1*grit);vec2 f=fract(p*vec2(1.2,2.4));joint=smoothstep(.002,.01,min(min(f.x,1.-f.x),min(f.y,1.-f.y)));albedo*=.8+.2*joint;shine=.5;}
 else {float brushed=noise(vec2(p.x*20.,p.y*270.));albedo=vec3(.043,.046,.048)*( .6+grit*.3+brushed*.5);vec2 f=fract(p*vec2(2.,2.8));float seam=smoothstep(.006,.018,min(min(f.x,1.-f.x),min(f.y,1.-f.y)));albedo*=.5+.5*seam;vec2 bolt=abs(f-.08);float rivet=1.-smoothstep(.012,.022,length(bolt));albedo+=rivet*.05;shine=.37;}
 vec3 light=vec3(.13,.15,.19)*uRoom+vec3(1.,.43,.13)*irradiance;

}
vec3 hearth(vec2 p){
 float glow=uLight;float opening=box(p-vec2(0,1.09),vec2(1.52,.96));float frontLight=glow*1.6/(.55+dot(p-vec2(0,.45),(p-vec2(0,.45))*vec2(.8,1.35)));
 vec3 col=vec3(0.);if(opening>=0.)col=stone(p,uMaterial,frontLight*.65);
 // Deep reveal, a soot-dark fireback, and the stone lip in front of the grate.
 if(opening<.0){vec2 q=p;float sh=exp(-pow((p.y-.33)*1.6,2.))*glow;float soot=1.-.82*smoothstep(.5,1.9,p.y);col=stone(q,0.,sh*.28)*soot*.53;float side=smoothstep(1.29,1.52,abs(p.x));if(side>.001)col=mix(col,stone(vec2(abs(p.x)*2.5,p.y),uMaterial,frontLight*.42)*(.7+side*.2),side);float top=smoothstep(1.88,2.05,p.y);col*=1.-top*.65;col+=vec3(.013,.004,.001)*glow*exp(-length(p-vec2(0,.5))*2.);}
 float rim=abs(opening);if(rim<.045){col=stone(p,uMaterial,frontLight*.8)*( .7+.3*smoothstep(0.,.045,rim));}
 if(p.y<.13){float fy=.13-p.y;vec2 floorP=vec2(p.x/(1.+fy*.7),fy*1.8);float pool=exp(-abs(p.x)*1.15-fy*3.)*glow;col=stone(floorP,uMaterial,pool*.8)*(.6+.4*exp(-fy*5.));col+=vec3(.16,.041,.005)*pool*.2;if(p.y>.077)col*=.58;}
 float shadow=exp(-pow((p.y-.18)*18.,2.))*exp(-pow(p.x*1.05,6.));col*=1.-shadow*.78;
 return col;
}
vec3 logPiece(vec3 col,vec2 p,vec2 a,vec2 b,float r,float seed,float presence){
 vec2 dir=normalize(b-a),normal=vec2(-dir.y,dir.x);float len=length(b-a);vec2 q=vec2(dot(p-a,dir),dot(p-a,normal));float taper=1.-.08*q.x/len;
 float rough=noise(vec2(q.x*26.+seed,q.y*50.))* .010+noise(vec2(q.x*89.,seed))* .004;
 float endWidth=.065+r*.35;float rd=r*taper+rough;
 float bodyD=box(q-vec2(len*.5,0.),vec2(len*.5,rd));
 float endShape=(length(vec2((q.x-len)/endWidth,q.y/rd))-1.)*rd;
 float leftShape=(length(vec2(q.x/(endWidth*.65),q.y/(r+rough)))-1.)*r;
 float d=min(bodyD,min(endShape,leftShape));float cover=(1.-smoothstep(-.003,.004,d))*presence;if(cover<.001)return col;
 float cylindrical=sqrt(max(0.,1.-pow(q.y/(r*taper+.012),2.)));float grain=fbm(vec2(q.x*7.+seed,q.y*94.));float fissure=pow(1.-abs(sin(q.y*114.+noise(vec2(q.x*11.,q.y*40.))*6.+seed)),13.);
 float cross=pow(1.-abs(sin(q.x*32.+noise(vec2(q.x*12.,q.y*50.+seed))*5.)),18.);
 float char=noise(vec2(q.x*33.,q.y*43.)+seed);float burn=.25+.75*noise(vec2(q.x*4.+seed,q.y*20.));float pulse=.72+.28*sin(uTime*(1.2+seed*.03)+q.x*5.+seed);
 float barkPlates=noise(vec2(q.x*19.,q.y*35.)+seed);float bevel=smoothstep(.18,.7,barkPlates);
 vec3 bark=mix(vec3(.014,.008,.005),vec3(.12,.066,.029),grain)*(.16+pow(cylindrical,2.)*.84)*(.55+bevel*.6);
 float birch=uWoodMix.z;float stripe=smoothstep(.7,.8,noise(vec2(q.x*38.,q.y*140.)+seed));bark=mix(bark,mix(vec3(.19,.17,.13),vec3(.012,.01,.008),stripe)*(.35+cylindrical*.65),birch*.6*(1.-burn*.5));
 float ember=(fissure*.9+cross*.5)*burn*pulse*(.25+uFire*.65);ember*=smoothstep(.16,.65,char+.25);float top=smoothstep(-r*.6,r*.8,q.y);
 bark*=.5+uRoom*.5+uLight*(.7+top*2.5);bark+=vec3(2.4,.20,.006)*ember+vec3(.38,.024,.001)*pow(grain,3.)*burn*top;
 // Elliptical cut ends have growth rings, radial cracks and a burnt rim.
 vec2 endQ=vec2((q.x-len)/endWidth,q.y/r);float endD=length(endQ);if(endD<1.){float rings=.5+.5*sin(endD*37.+noise(endQ*5.+seed)*3.);float crack=pow(abs(sin(atan(endQ.y,endQ.x)*5.+seed)),28.)*smoothstep(.2,1.,endD);vec3 cut=vec3(.15,.068,.024)*(.5+rings*.5)*( .6+uLight);cut*=1.-crack*.88;cut=mix(cut,vec3(.017,.009,.005),smoothstep(.78,1.,endD));cut+=vec3(1.,.11,.005)*crack*.17*pulse;bark=mix(bark,cut,.95);}

}
vec3 logs(vec3 col,vec2 p){

$('mute').addEventListener('click',toggleMute);
$('togglePanel').addEventListener('click',()=>{showPanel(manualHidden);wakeUI();});$('closePanel').addEventListener('click',()=>{showPanel(false);$('togglePanel').focus();});
async function fullscreen(){try{if(document.fullscreenElement){await document.exitFullscreen();}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();}else if(document.documentElement.webkitRequestFullscreen){document.documentElement.webkitRequestFullscreen();}else{toast('Use your browser’s fullscreen or Add to Home Screen option.');}}catch{toast('Fullscreen is unavailable here. Try your browser’s fullscreen option.');}}
$('fullscreen').addEventListener('click',fullscreen);
$('copy').addEventListener('click',async()=>{writeHash();try{await navigator.clipboard.writeText(location.href);toast('Link copied. This fire is yours to share.');}catch{const field=document.createElement('textarea');field.value=location.href;field.style.cssText='position:fixed;left:0;top:0;opacity:0';document.body.append(field);field.select();const ok=document.execCommand('copy');field.remove();toast(ok?'Link copied. This fire is yours to share.':'Copy the address bar to share this fire.');}});
$('copyTop').addEventListener('click',()=>$('copy').click());
window.addEventListener('hashchange',()=>{readHash();refreshControls();});
window.addEventListener('keydown',e=>{wakeUI();if(e.ctrlKey||e.metaKey||e.altKey||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key.toLowerCase()==='f'){e.preventDefault();fullscreen();}else if(e.key.toLowerCase()==='h'){e.preventDefault();showPanel(manualHidden);}else if(e.key.toLowerCase()==='m'){e.preventDefault();toggleMute();}else if(e.key==='Escape')showPanel(false);});
window.addEventListener('pointermove',wakeUI,{passive:true});window.addEventListener('pointerdown',wakeUI,{passive:true});window.addEventListener('touchstart',wakeUI,{passive:true});
canvas.addEventListener('click',()=>{if(started&&manualHidden){showPanel(true);wakeUI();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);hiddenAt=Date.now();if(audio)audio.ctx.suspend().catch(()=>{});if(wake){const handle=wake;wake=null;handle.release().catch(()=>{});}writeHash();}else{if(hiddenAt){burnFor(Math.max(0,(Date.now()-hiddenAt)/1000));hiddenAt=0;}lastFrame=0;frameMean=16.67;measureFrames=0;raf=requestAnimationFrame(frame);if(started){requestWake();if(audio)audio.ctx.resume().catch(()=>{});}wakeUI();}});
})();
</script>
</body>
</html>
